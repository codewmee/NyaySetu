<!-- ================= NAV STYLES ================= -->
<style>
    /* ---- Nav bar ---- */
    .site-nav {
        position: sticky;
        top: 0;
        z-index: 300;
        background: rgba(251, 252, 251, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid transparent;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .site-nav.scrolled {
        border-bottom-color: var(--border);
        box-shadow: 0 2px 12px rgba(7, 22, 19, 0.04);
    }

    .nav-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 16px 32px;
        max-width: var(--container);
        margin: 0 auto;
        position: relative;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-shrink: 0;
    }

    .brand-icon {
        font-size: 22px;
    }

    .brand-text {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.3px;
        color: var(--ink);
    }

    .nav-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
    }

    .lang-dropdown {
        position: relative;
    }

    .lang-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: var(--radius-full);
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
        background: #fff;
    }

    .lang-toggle:hover {
        background: var(--bg-soft);
    }

    .lang-menu {
        margin-top: 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        overflow: hidden;
        display: none;
        position: absolute;
        right: 0;
        background: #fff;
        width: 170px;
        max-height: 280px;
        overflow-y: auto;
        z-index: 350;
        box-shadow: var(--shadow-lg);
    }

    .lang-menu.open {
        display: block;
    }

    .lang-menu li {
        padding: 10px 14px;
        font-size: 13px;
        cursor: pointer;
    }

    .lang-menu li:hover {
        background: var(--bg-soft);
    }

    .lang-menu li.selected {
        color: var(--accent);
        background: var(--accent-soft);
        font-weight: 600;
    }

    .account-area {
        position: relative;
    }

    .account-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 6px 12px 6px 6px;
        background: #fff;
    }

    .account-toggle:hover {
        background: var(--bg-soft);
    }

    .account-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .account-name {
        font-size: 13px;
        font-weight: 600;
    }

    .account-menu {
        margin-top: 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        overflow: hidden;
        display: none;
        position: absolute;
        right: 0;
        background: #fff;
        width: 170px;
        z-index: 350;
        box-shadow: var(--shadow-lg);
    }

    .account-menu.open {
        display: block;
    }

    .account-menu li a {
        display: block;
        padding: 10px 14px;
        font-size: 13px;
    }

    .account-menu li a:hover {
        background: var(--bg-soft);
    }

    .account-menu li.divider {
        border-top: 1px solid var(--border);
    }

    .account-menu li a.danger {
        color: #b3261e;
    }

    /* ---- Hamburger + mobile menu ---- */
    .hamburger {
        display: none;
        font-size: 20px;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-md);
        flex-shrink: 0;
    }

    .hamburger:hover {
        background: var(--bg-soft);
    }

    .hamburger.open {
        background: var(--bg-soft);
    }

    .mobile-menu-panel {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: #fff;
        border-top: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transform: translateY(-6px);
        transition: max-height 0.32s ease, opacity 0.22s ease, transform 0.22s ease;
        z-index: 250;
    }

    .mobile-menu-panel.open {
        max-height: calc(100vh - 60px);
        overflow-y: auto;
        opacity: 1;
        transform: translateY(0);
    }

    .mobile-menu-inner {
        padding: 10px 20px 28px;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .mobile-menu-lang {
        padding: 16px 6px 6px;
    }

    .mobile-menu-lang-label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--stone);
        margin-bottom: 10px;
    }

    .mobile-lang-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .mobile-lang-list li {
        border: 1px solid var(--border);
        border-radius: var(--radius-full);
        padding: 7px 14px;
        font-size: 12.5px;
        cursor: pointer;
    }

    .mobile-lang-list li.selected {
        color: var(--accent);
        background: var(--accent-soft);
        border-color: var(--accent);
        font-weight: 600;
    }

    .mobile-menu-auth {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 18px;
    }

    .mobile-menu-auth .btn {
        width: 100%;
    }

    /* ---- Misc nav icon helpers ---- */
    .logo {
        height: 100px;
        width: auto;
    }

    .multilang_icon {
        height: 20px;
        width: auto;
    }

    /* ---- Nav responsive ---- */
    @media (max-width: 900px) {

        .nav-right .lang-dropdown,
        .nav-right .account-area,
        .nav-right .btn-outline,
        .nav-right>.btn-primary {
            display: none;
        }

        .hamburger {
            display: flex;
        }

        /* Floating rounded pill nav — detached from the screen edges with a hovering shadow */
        .site-nav {
            top: 12px;
            margin: 0 12px;
            border-radius: var(--radius-full);
            background: #fff;
            backdrop-filter: none;
            box-shadow: var(--shadow-lg);
            border-bottom: none;
        }

        .site-nav.scrolled {
            border-bottom-color: transparent;
            box-shadow: var(--shadow-lg);
        }

        .nav-inner {
            padding: 10px 10px 10px 18px;
        }

        /* Logo image disappears on mobile — brand name text only */
        .brand-icon {
            display: none;
        }

        .brand-text {
            font-size: 16px;
        }

        /* Mobile menu opens as its own separate floating rounded card, with a gap below the pill nav */
        .mobile-menu-panel {
            display: block;
            top: calc(100% + 10px);
            border-top: none;
            border-radius: var(--radius-lg);
        }

        .mobile-menu-panel.open {
            max-height: calc(100vh - 90px);
        }
    }
</style>


<!-- ================= NAV ================= -->
<nav class="site-nav" id="siteNav">
    <div class="nav-inner">
        <a href="/" class="brand">
            <span class="brand-icon"><img src="../static/icons/logo.jpg" alt="" class="logo"></span>
            <span class="brand-text">NyaySetu</span>
        </a>


        <div class="nav-right">
            <div class="lang-dropdown" id="navLangDropdown">
                <button class="lang-toggle" id="navLangToggle">
                    <span><img src="../static/icons/languages.png" alt="change language" class="multilang_icon"></span>
                    <span>▾</span>
                </button>
                <ul class="lang-menu lang-menu-instance" id="navLangMenu"></ul>
            </div>

            {% if user %}
            <div class="account-area">
                <button class="account-toggle" id="accountToggle">
                    <span class="account-avatar">{{ user.initial }}</span>
                    <span class="account-name">{{ user.first_name }}</span>
                    <span>▾</span>
                </button>
                <ul class="account-menu" id="accountMenu">
                    <li><a href="/dashboard">Dashboard</a></li>

                    <li class="divider"><a href="/logout" class="danger">Logout</a></li>
                </ul>
            </div>
            {% else %}
            <a href="/login" class="btn btn-outline">Log In</a>
            <a href="/login" class="btn btn-primary">Sign Up</a>
            {% endif %}

            <button class="hamburger" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false">☰</button>
        </div>
    </div>

    <!-- ================= MOBILE MENU (opens top-down under the nav) ================= -->
    <div class="mobile-menu-panel" id="mobileMenuPanel">
        <div class="mobile-menu-inner">

            <div class="mobile-menu-lang">
                <span class="mobile-menu-lang-label">Language</span>
                <ul class="lang-menu-instance mobile-lang-list" id="mobileLangMenu"></ul>
            </div>

            <div class="mobile-menu-auth">
                {% if user %}
                <a href="/dashboard" class="btn btn-primary">Go to Dashboard</a>
                <a href="/logout" class="btn btn-outline">Logout</a>
                {% else %}
                <a href="/login" class="btn btn-outline">Log In</a>
                <a href="/login" class="btn btn-primary">Sign Up</a>
                {% endif %}
            </div>

        </div>
    </div>
</nav>

<!-- ================= NAV SCRIPT ================= -->
<script>
    // ---- i18n engine (powers the language switcher; extend with data-i18n elements sitewide) ----
    let LANGUAGES = [{ code: "en", label: "English" }];
    let TRANSLATIONS = {};
    let currentLang = 'en';

    async function loadLanguageData() {
        try {
            const res = await fetch("{{ url_for('static', filename='translations.json') }}");
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            if (data.languages && data.languages.length) LANGUAGES = data.languages;
            if (data.translations) TRANSLATIONS = data.translations;
        } catch (err) {
            console.warn('Could not load /static/translations.json — falling back to English only.', err);
        }
    }

    function getText(key, lang) {
        const entry = TRANSLATIONS[key];
        if (!entry) return '';
        return entry[lang] || entry.en || '';
    }

    function applyLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (TRANSLATIONS[key]) el.textContent = getText(key, lang);
        });
        const langInfo = LANGUAGES.find(l => l.code === lang) || LANGUAGES[0];
        document.querySelectorAll('.navLangSelected').forEach(el => { el.textContent = langInfo.label; });
        document.querySelectorAll('.lang-menu-instance').forEach(menuEl => {
            menuEl.querySelectorAll('li').forEach(li => {
                li.classList.toggle('selected', li.dataset.lang === lang);
            });
        });
        document.documentElement.lang = lang;
    }

    function buildLangMenu(menuEl) {
        menuEl.innerHTML = '';
        LANGUAGES.forEach(({ code, label }) => {
            const li = document.createElement('li');
            li.dataset.lang = code;
            li.textContent = label;
            if (code === currentLang) li.classList.add('selected');
            menuEl.appendChild(li);
        });
    }

    function wireLangDropdown(toggleId, menuId) {
        const toggle = document.getElementById(toggleId);
        const menu = document.getElementById(menuId);
        if (!toggle || !menu) return;
        toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.lang-menu, .account-menu').forEach(m => { if (m !== menu) m.classList.remove('open'); });
            menu.classList.toggle('open');
        });
        menu.addEventListener('click', (e) => {
            const item = e.target.closest('li[data-lang]');
            if (!item) return;
            applyLanguage(item.dataset.lang);
            menu.classList.remove('open');
        });
    }

    wireLangDropdown('navLangToggle', 'navLangMenu');

    // Mobile-panel language list (tap to select, always visible — no open/close toggle needed)
    const mobileLangMenu = document.getElementById('mobileLangMenu');
    if (mobileLangMenu) {
        mobileLangMenu.addEventListener('click', (e) => {
            const item = e.target.closest('li[data-lang]');
            if (!item) return;
            applyLanguage(item.dataset.lang);
        });
    }

    // ---- Account menu ----
    const accountToggle = document.getElementById('accountToggle');
    const accountMenu = document.getElementById('accountMenu');
    if (accountToggle && accountMenu) {
        accountToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.lang-menu').forEach(m => m.classList.remove('open'));
            accountMenu.classList.toggle('open');
        });
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.lang-dropdown'))
            document.querySelectorAll('.lang-menu').forEach(m => m.classList.remove('open'));
        if (!e.target.closest('.account-area'))
            document.querySelectorAll('.account-menu').forEach(m => m.classList.remove('open'));
    });

    // ---- Nav scroll shadow ----
    const siteNav = document.getElementById('siteNav');
    window.addEventListener('scroll', () => {
        siteNav.classList.toggle('scrolled', window.scrollY > 8);
    }, { passive: true });

    // ---- Mobile menu (top-down panel under the nav) ----
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const mobileMenuPanel = document.getElementById('mobileMenuPanel');

    function closeMobileMenu() {
        mobileMenuPanel.classList.remove('open');
        hamburgerBtn.classList.remove('open');
        hamburgerBtn.setAttribute('aria-expanded', 'false');
        hamburgerBtn.textContent = '☰';
    }

    function openMobileMenu() {
        mobileMenuPanel.classList.add('open');
        hamburgerBtn.classList.add('open');
        hamburgerBtn.setAttribute('aria-expanded', 'true');
        hamburgerBtn.textContent = '✕';
    }

    if (hamburgerBtn && mobileMenuPanel) {
        hamburgerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = mobileMenuPanel.classList.contains('open');
            if (isOpen) closeMobileMenu(); else openMobileMenu();
        });

        mobileMenuPanel.querySelectorAll('a').forEach(a => {
            a.addEventListener('click', closeMobileMenu);
        });

        document.addEventListener('click', (e) => {
            if (mobileMenuPanel.classList.contains('open') &&
                !e.target.closest('#mobileMenuPanel') &&
                !e.target.closest('#hamburgerBtn')) {
                closeMobileMenu();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeMobileMenu();
        });

        const mobileBreakpoint = window.matchMedia('(max-width: 900px)');
        const handleBreakpointChange = (e) => { if (!e.matches) closeMobileMenu(); };
        if (mobileBreakpoint.addEventListener) mobileBreakpoint.addEventListener('change', handleBreakpointChange);
    }

    // ---- Kick off i18n once the DOM for this nav is in place ----
    (async function initNav() {
        await loadLanguageData();
        document.querySelectorAll('.lang-menu-instance').forEach(buildLangMenu);
        applyLanguage('en');
    })();
</script>
