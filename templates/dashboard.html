<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — NyaySetu</title>
    <meta name="description" content="Track your legal cases, documents, and next steps in one place.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #17171c;
            --cohere-black: #000000;
            --ink: #212121;
            --deep-green: #003c33;
            --dark-navy: #071829;
            --canvas: #ffffff;
            --soft-stone: #eeece7;
            --pale-green: #edfce9;
            --pale-blue: #f1f5ff;
            --hairline: #d9d9dd;
            --border-light: #e5e7eb;
            --card-border: #f2f2f2;
            --muted: #93939f;
            --slate: #75758a;
            --body-muted: #616161;
            --action-blue: #1863dc;
            --coral: #ff7759;
            --coral-soft: #ffad9b;
            --form-focus: #9b60aa;
            --on-primary: #ffffff;
            --on-dark: #ffffff;
            --error: #b30000;
            --success: #0a7a4a;
            --amber: #b8860b;

            --risk-low: #0a7a4a;
            --risk-low-bg: #edfce9;
            --risk-medium: #b8860b;
            --risk-medium-bg: #fbf3df;
            --risk-high: #b8460e;
            --risk-high-bg: #fdece6;

            --r-xs: 4px;
            --r-sm: 8px;
            --r-md: 16px;
            --r-lg: 22px;
            --r-xl: 30px;
            --r-pill: 32px;
            --r-full: 9999px;

            --font-display: 'Space Grotesk', 'CohereText', ui-sans-serif, system-ui;
            --font-body: 'Inter', 'Unica77 Cohere Web', ui-sans-serif, system-ui;
            --font-mono: 'IBM Plex Mono', 'CohereMono', ui-sans-serif, system-ui;

            --container: 1220px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background: var(--canvas);
            color: var(--ink);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: var(--font-display);
            font-weight: 500;
            color: var(--ink);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        ul {
            list-style: none;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 2px solid #4c6ee6;
            outline-offset: 2px;
        }

        .wrap {
            max-width: var(--container);
            margin: 0 auto;
            padding: 0 32px;
        }

        section {
            position: relative;
        }

        .mono-label {
            font-family: var(--font-mono);
            font-size: 13px;
            letter-spacing: 0.28px;
            text-transform: uppercase;
            color: var(--slate);
        }

        /* ===== buttons ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.71;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--on-primary);
            border-radius: var(--r-pill);
            padding: 12px 22px;
        }

        .btn-primary:hover {
            background: #000;
        }

        .btn-secondary {
            background: transparent;
            color: var(--ink);
            border-radius: var(--r-xs);
            padding: 8px 0;
            border-bottom: 1px solid var(--ink);
            font-size: 14px;
        }

        .btn-pill-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--border-light);
            border-radius: var(--r-xl);
            padding: 7px 15px;
            font-size: 13.5px;
            font-weight: 500;
            transition: background .15s ease, color .15s ease, border-color .15s ease;
        }

        .btn-pill-outline:hover {
            border-color: var(--primary);
        }

        .btn-pill-outline.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--ink);
            border: 1px solid var(--border-light);
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: var(--soft-stone);
        }

        /* ===== page header ===== */
        .page-header {
            padding: 48px 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            margin-top: 8px;
            font-size: clamp(1.8rem, 3.4vw, 2.6rem);
            letter-spacing: -.6px;
        }

        .page-header .subtext {
            margin-top: 8px;
            color: var(--body-muted);
            font-size: 15px;
            max-width: 440px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        /* ===== stats ===== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 52px;
        }

        @media (max-width:900px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width:520px) {
            .stats-row {
                grid-template-columns: 1fr;
            }
        }

        .stat-card {
            border-radius: var(--r-xs);
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-card.st-1 {
            background: var(--pale-green);
        }

        .stat-card.st-2 {
            background: var(--soft-stone);
        }

        .stat-card.st-3 {
            background: var(--pale-blue);
        }

        .stat-card.st-4 {
            background: var(--soft-stone);
        }

        .stat-card .stat-num {
            font-family: var(--font-display);
            font-size: 34px;
            font-weight: 500;
            letter-spacing: -.4px;
        }

        .stat-card .stat-label {
            font-size: 13px;
            color: var(--body-muted);
        }

        .stat-card .stat-delta {
            font-size: 11.5px;
            color: var(--success);
            font-family: var(--font-mono);
            margin-top: 2px;
        }

        /* ===== risk meter stat card ===== */
        .risk-meter-card {
            border-radius: var(--r-xs);
            padding: 22px;
            background: var(--soft-stone);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .risk-meter-card .stat-label {
            font-size: 13px;
            color: var(--body-muted);
        }

        .risk-meter-bar {
            display: flex;
            width: 100%;
            height: 14px;
            border-radius: var(--r-full);
            overflow: hidden;
            background: var(--border-light);
        }

        .risk-meter-seg {
            position: relative;
            height: 100%;
            min-width: 3px;
            transition: filter .15s ease;
            cursor: pointer;
        }

        .risk-meter-seg:hover {
            filter: brightness(0.92);
        }

        .risk-meter-seg.risk-high { background: var(--risk-high); }
        .risk-meter-seg.risk-medium { background: var(--risk-medium); }
        .risk-meter-seg.risk-low { background: var(--risk-low); }

        .risk-meter-legend {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .risk-meter-legend-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--body-muted);
            cursor: pointer;
        }

        .risk-meter-legend-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .risk-meter-legend-item .dot.risk-high { background: var(--risk-high); }
        .risk-meter-legend-item .dot.risk-medium { background: var(--risk-medium); }
        .risk-meter-legend-item .dot.risk-low { background: var(--risk-low); }

        /* shared tooltip used by both the risk meter and the per-case risk dot */
        .risk-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: #fff;
            padding: 10px 12px;
            border-radius: var(--r-xs);
            font-size: 12px;
            line-height: 1.5;
            white-space: normal;
            width: max-content;
            max-width: 230px;
            z-index: 20;
            box-shadow: 0 10px 24px rgba(0, 0, 0, .22);
        }

        .risk-tooltip strong {
            display: block;
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: .3px;
            text-transform: uppercase;
            margin-bottom: 4px;
            color: #fff;
        }

        .risk-tooltip ul {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .risk-tooltip li {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .risk-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: var(--primary);
        }

        .risk-meter-seg:hover .risk-tooltip,
        .risk-meter-legend-item:hover .risk-tooltip {
            display: block;
        }

        /* ===== main grid ===== */
        .dash-grid {
            display: grid;
            grid-template-columns: 1.7fr 1fr;
            gap: 24px;
            padding-bottom: 90px;
            align-items: start;
        }

        @media (max-width:1000px) {
            .dash-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== case list ===== */
        .panel {
            border: 1px solid var(--card-border);
            border-radius: var(--r-sm);
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 20px 22px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--card-border);
        }

        .panel-header h3 {
            font-size: 19px;
            font-weight: 500;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-light);
            border-radius: var(--r-full);
            padding: 8px 14px;
            font-size: 13px;
            min-width: 190px;
        }

        .search-box input {
            border: none;
            outline: none;
            font-size: 13px;
            font-family: inherit;
            width: 100%;
        }

        .case-table {
            padding: 8px 0 4px;
        }

        .case-row {
            display: grid;
            grid-template-columns: 2.4fr auto 1fr auto;
            align-items: center;
            gap: 12px;
            padding: 16px 22px;
            border-bottom: 1px solid var(--card-border);
            cursor: pointer;
        }

        .case-row:hover {
            background: var(--soft-stone);
        }

        .case-row:last-child {
            border-bottom: none;
        }

        .case-title-cell {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }

        .case-title-cell strong {
            font-size: 14.5px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .case-cat {
            align-self: flex-start;
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: .28px;
            text-transform: uppercase;
            color: var(--slate);
        }

        /* ===== per-case risk indicator (replaces the old status badge) ===== */
        .risk-dot-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .risk-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px var(--card-border);
        }

        .risk-dot.risk-high { background: var(--risk-high); }
        .risk-dot.risk-medium { background: var(--risk-medium); }
        .risk-dot.risk-low { background: var(--risk-low); }

        .risk-dot-wrap .risk-tooltip {
            bottom: calc(100% + 8px);
            white-space: nowrap;
            max-width: none;
        }

        .risk-dot-wrap:hover .risk-tooltip {
            display: block;
        }

        .case-date {
            font-size: 12.5px;
            color: var(--muted);
            justify-self: end;
        }

        .case-chevron {
            font-size: 14px;
            color: var(--muted);
            transition: transform .2s ease;
        }

        .case-row.open .case-chevron {
            transform: rotate(90deg);
        }

        .case-detail {
            display: none;
            padding: 0 22px 22px;
            border-bottom: 1px solid var(--card-border);
        }

        .case-detail.open {
            display: block;
        }

        .timeline {
            display: flex;
            gap: 0;
            margin: 10px 0 18px;
        }

        .timeline-step {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .timeline-step .bar {
            height: 3px;
            background: var(--card-border);
            border-radius: 2px;
        }

        .timeline-step.done .bar {
            background: var(--deep-green);
        }

        .timeline-step.current .bar {
            background: var(--coral);
        }

        .timeline-step span {
            font-size: 11.5px;
            color: var(--body-muted);
        }

        .timeline-step.done span,
        .timeline-step.current span {
            color: var(--ink);
            font-weight: 500;
        }

        .case-detail-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .case-detail p.desc {
            font-size: 13.5px;
            color: var(--body-muted);
            margin-bottom: 14px;
            max-width: 600px;
            line-height: 1.55;
        }

        .empty-state {
            padding: 60px 22px;
            text-align: center;
            color: var(--muted);
            font-size: 13.5px;
            display: none;
        }

        .empty-state.show {
            display: block;
        }

        /* ===== sidebar ===== */
        .side-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .side-panel {
            border: 1px solid var(--card-border);
            border-radius: var(--r-sm);
            padding: 20px 22px;
        }

        .side-panel h4 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 14px;
        }

        .doc-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .doc-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid var(--card-border);
            cursor: pointer;
        }

        .doc-item:hover {
            background: var(--soft-stone);
        }

        .doc-item:last-child {
            border-bottom: none;
        }

        .doc-icon {
            font-size: 16px;
        }

        .doc-info {
            flex: 1;
            min-width: 0;
        }

        .doc-info strong {
            display: block;
            font-size: 13px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .doc-info span {
            font-size: 11px;
            color: var(--muted);
        }

        .upload-btn {
            margin-top: 14px;
            width: 100%;
            border: 1px dashed var(--border-light);
            border-radius: var(--r-xs);
            padding: 12px;
            font-size: 13px;
            color: var(--body-muted);
            text-align: center;
        }

        .upload-btn:hover {
            border-color: var(--deep-green);
            color: var(--deep-green);
            background: var(--pale-green);
        }

        .upload-btn:disabled {
            opacity: .6;
            cursor: default;
        }

        .doc-empty {
            padding: 14px 0;
            font-size: 12.5px;
            color: var(--muted);
        }

        /* ===== toast ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--primary);
            color: #fff;
            padding: 12px 22px;
            border-radius: var(--r-sm);
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s, transform .25s;
            z-index: 999;
            box-shadow: 0 12px 28px rgba(0, 0, 0, .18);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width:640px) {
            .case-row {
                grid-template-columns: 1fr auto;
                grid-template-areas: "title chev" "risk risk" "date date";
                row-gap: 8px;
            }

            .case-row .case-title-cell {
                grid-area: title;
            }

            .case-row .case-chevron {
                grid-area: chev;
            }

            .case-row .risk-dot-wrap {
                grid-area: risk;
                justify-content: flex-start;
            }

            .case-row .case-date {
                grid-area: date;
                justify-self: start;
            }

            .panel-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-box {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    {% include 'partials/nav.html' %}
    <div class="wrap">
        <div class="page-header">
            <div>
                <span class="mono-label">Dashboard</span>
                <h1>Welcome back, {{ user.name.split(' ')[0] if user and user.name else 'there' }}.</h1>
                <p class="subtext">Here's where your cases, documents, and next steps stand today.</p>
            </div>
            <div class="header-actions">
                <a href="/new-issue" class="btn btn-primary">+ Describe New Issue</a>
            </div>
        </div>

        <div class="stats-row" id="statsRow"></div>

        <div class="dash-grid">
            <div>
                <div class="panel">
                    <div class="panel-header">
                        <h3>My Cases</h3>
                        <div class="search-box">
                            <span>🔍</span>
                            <input type="text" id="caseSearch" placeholder="Search your cases…">
                        </div>
                    </div>
                    <div class="case-table" id="caseTable"></div>
                    <div class="empty-state" id="emptyState">No cases match your search yet.</div>
                </div>
            </div>

            <div class="side-stack">

                <div class="side-panel">
                    <h4>Recent documents</h4>
                    <div class="doc-list" id="docList"></div>
                    <button class="upload-btn" id="uploadDocBtn" type="button">＋ Upload a document</button>
                    <input type="file" id="docFileInput" hidden>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>


    <script>
        // ==========================================================================
        // Dashboard data — all of it is real now, pulled from /api/dashboard/data
        // (see app.py: dashboard_data()). Cases ARE the chat history: each case
        // row is one conversation thread, "Continue conversation" / clicking a
        // row takes you into /case/<id> which loads that exact thread.
        //
        // Risk is derived client-side from each case's status (needs -> high,
        // review -> medium, resolved -> low) unless the backend already sends
        // an explicit `risk` field on the case, which takes priority.
        // ==========================================================================

        async function fetchDashboardData() {
            const res = await fetch('/api/dashboard/data');
            if (!res.ok) throw new Error('Failed to load dashboard data');
            return res.json();
        }

        // ---- toast ----
        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
        }

        // ---- risk helpers ----
        const RISK_LABEL = { high: 'High risk', medium: 'Medium risk', low: 'Low risk' };
        const STATUS_TO_RISK = { needs: 'high', review: 'medium', resolved: 'low' };

        function riskOf(c) {
            return c.risk || STATUS_TO_RISK[c.status] || 'medium';
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        // ---- render: stats (backend-driven, minus any pending/resolve stat —
        // that's replaced by the risk meter below) ----
        function renderStats(stats) {
            const row = document.getElementById('statsRow');
            const filtered = (stats || []).filter(s => !/pending|resolve/i.test(s.label || ''));
            row.innerHTML = filtered.map(s => `
        <div class="stat-card ${s.tone}">
          <span class="stat-num">${s.value}</span>
          <span class="stat-label">${s.label}</span>
          ${s.delta ? `<span class="stat-delta">${s.delta}</span>` : ''}
        </div>`).join('');
            row.insertAdjacentHTML('beforeend', renderRiskMeterCard());
        }

        // ---- render: risk meter card (replaces the old "pending resolve" stat) ----
        function riskTooltipHtml(level, cases) {
            const items = cases.length
                ? cases.slice(0, 6).map(c => `<li>${escapeHtml(c.title)}</li>`).join('')
                : '<li>No cases at this level</li>';
            const more = cases.length > 6 ? `<li>+${cases.length - 6} more</li>` : '';
            return `
        <div class="risk-tooltip">
          <strong>${RISK_LABEL[level]} · ${cases.length}</strong>
          <ul>${items}${more}</ul>
        </div>`;
        }

        function renderRiskMeterCard() {
            const byRisk = { high: [], medium: [], low: [] };
            ALL_CASES.forEach(c => byRisk[riskOf(c)].push(c));
            const total = ALL_CASES.length || 1;

            const segs = ['high', 'medium', 'low'].map(level => {
                const cases = byRisk[level];
                const pct = Math.max(cases.length ? (cases.length / total) * 100 : 0, cases.length ? 4 : 0);
                if (!cases.length) return '';
                return `
          <div class="risk-meter-seg risk-${level}" style="width:${pct}%">
            ${riskTooltipHtml(level, cases)}
          </div>`;
            }).join('');

            const legend = ['high', 'medium', 'low'].map(level => `
        <span class="risk-meter-legend-item">
          <span class="dot risk-${level}"></span>${RISK_LABEL[level]} · ${byRisk[level].length}
          ${riskTooltipHtml(level, byRisk[level])}
        </span>`).join('');

            return `
        <div class="risk-meter-card">
          <span class="stat-label">Risk meter</span>
          <div class="risk-meter-bar">${segs}</div>
          <div class="risk-meter-legend">${legend}</div>
        </div>`;
        }

        // ---- render: cases (= chat history) ----
        let ALL_CASES = [];
        let currentSearch = '';
        const STEPS = ['Submitted', 'Under review', 'Guidance ready', 'Resolved'];

        function renderCases() {
            const table = document.getElementById('caseTable');
            const empty = document.getElementById('emptyState');
            const q = currentSearch.toLowerCase();
            const filtered = ALL_CASES.filter(c =>
                q === '' || c.title.toLowerCase().includes(q) || c.category.toLowerCase().includes(q)
            );

            if (filtered.length === 0) {
                table.innerHTML = '';
                empty.classList.add('show');
                return;
            }
            empty.classList.remove('show');

            table.innerHTML = filtered.map(c => {
                const level = riskOf(c);
                return `
        <div class="case-row" data-id="${c.id}">
          <div class="case-title-cell">
            <strong>${c.title}</strong>
            <span class="case-cat">${c.category}</span>
          </div>
          <div class="risk-dot-wrap">
            <span class="risk-dot risk-${level}"></span>
            ${riskTooltipHtml(level, [c])}
          </div>
          <span class="case-date">${c.updated}</span>
          <span class="case-chevron">›</span>
        </div>
        <div class="case-detail" data-detail-for="${c.id}">
          <p class="desc">${c.desc}</p>
          <div class="timeline">
            ${STEPS.map((label, i) => `
              <div class="timeline-step ${i < c.step ? 'done' : i === c.step ? 'current' : ''}">
                <div class="bar"></div>
                <span>${label}</span>
              </div>`).join('')}
          </div>
          <div class="case-detail-actions">
            <a href="/case/${c.id}" class="btn btn-primary">Continue conversation</a>
            ${c.status !== 'resolved' ? `<button class="btn-pill-outline mark-resolved" data-id="${c.id}">Mark as resolved</button>` : ''}
          </div>
        </div>
      `;
            }).join('');

            // Clicking anywhere on the row (except the resolve button) opens
            // that case's chat thread directly — the expand-to-preview is just
            // a chevron click, everything else navigates straight into the chat.
            table.querySelectorAll('.case-row').forEach(row => {
                const chevron = row.querySelector('.case-chevron');
                chevron.addEventListener('click', e => {
                    e.stopPropagation();
                    const id = row.dataset.id;
                    const detail = table.querySelector(`.case-detail[data-detail-for="${id}"]`);
                    const isOpen = row.classList.contains('open');
                    table.querySelectorAll('.case-row.open').forEach(r => r.classList.remove('open'));
                    table.querySelectorAll('.case-detail.open').forEach(d => d.classList.remove('open'));
                    if (!isOpen) {
                        row.classList.add('open');
                        detail.classList.add('open');
                    }
                });
                row.addEventListener('click', e => {
                    if (e.target.closest('.mark-resolved') || e.target.closest('.case-chevron') || e.target.closest('.risk-dot-wrap')) return;
                    window.location.href = `/case/${row.dataset.id}`;
                });
            });

            table.querySelectorAll('.mark-resolved').forEach(btn => {
                btn.addEventListener('click', async e => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    try {
                        const res = await fetch(`/api/dashboard/cases/${id}/resolve`, { method: 'POST' });
                        if (!res.ok) throw new Error();
                        const c = ALL_CASES.find(x => String(x.id) === String(id));
                        if (c) { c.status = 'resolved'; c.risk = 'low'; c.step = 3; c.updated = 'Just now'; }
                        showToast('Case marked as resolved.');
                        renderCases();
                        renderRiskMeter();
                    } catch {
                        showToast('Could not update that case — try again.');
                    }
                });
            });
        }

        function renderRiskMeter() {
            const row = document.getElementById('statsRow');
            const existing = row.querySelector('.risk-meter-card');
            if (existing) existing.remove();
            row.insertAdjacentHTML('beforeend', renderRiskMeterCard());
        }

        document.getElementById('caseSearch').addEventListener('input', e => {
            currentSearch = e.target.value;
            renderCases();
        });

        // ---- render: documents ----
        function renderDocs(docs) {
            const list = document.getElementById('docList');
            if (!docs.length) {
                list.innerHTML = `<div class="doc-empty">No documents uploaded yet.</div>`;
                return;
            }
            list.innerHTML = docs.map(d => `
        <div class="doc-item" data-case-id="${d.case_id}" title="Open in chat">
          <span class="doc-icon">📄</span>
          <div class="doc-info"><strong>${d.name}</strong><span>${[d.size, d.date].filter(Boolean).join(' · ')}</span></div>
        </div>`).join('');

            // Clicking a recent document takes you into the chat thread it
            // belongs to, same as clicking its case in the list above.
            list.querySelectorAll('.doc-item').forEach(item => {
                item.addEventListener('click', () => {
                    window.location.href = `/case/${item.dataset.caseId}`;
                });
            });
        }

        // ---- sidebar upload -> creates/attaches a case, redirects into that chat ----
        const uploadBtn = document.getElementById('uploadDocBtn');
        const uploadInput = document.getElementById('docFileInput');

        uploadBtn.addEventListener('click', () => uploadInput.click());

        uploadInput.addEventListener('change', async e => {
            const file = e.target.files[0];
            e.target.value = '';
            if (!file) return;

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading…';

            try {
                const formData = new FormData();
                formData.append('file', file);
                // No case_id here => backend creates a fresh case for this
                // upload. Pass one (e.g. from a "add to this case" affordance)
                // if you want to attach to an existing thread instead.

                const res = await fetch('/api/dashboard/upload-document', {
                    method: 'POST',
                    body: formData,
                });
                const data = await res.json();
                if (!res.ok || !data.ok) throw new Error(data.error || 'Upload failed');

                showToast('Document uploaded — opening chat…');
                window.location.href = data.redirect_url;
            } catch (err) {
                uploadBtn.disabled = false;
                uploadBtn.textContent = '＋ Upload a document';
                showToast(err.message || 'Upload failed — try again.');
            }
        });

        // ---- init ----
        (async function init() {
            try {
                const data = await fetchDashboardData();
                ALL_CASES = data.cases;
                renderStats(data.stats);
                renderCases();
                renderDocs(data.documents);
            } catch (err) {
                showToast('Could not load your dashboard — refresh to try again.');
            }
        })();
    </script>
</body>

</html>
